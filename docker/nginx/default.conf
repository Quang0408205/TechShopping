# Frontend + cổng vào duy nhất khi triển khai: phục vụ ./frontend (không cache, sửa là thấy ngay)
# và chuyển tiếp /api, /uploads sang backend, nên chỉ cần mở ra internet MỘT cổng này (ngrok / Cloudflare Tunnel).
# Mở cho người khác thử qua địa chỉ công khai (ngrok…) thì chỉ có trang khách: trang /admin/ và API của nhân viên /
# quản trị chỉ dùng được ngay trên máy chạy Docker (localhost), từ ngoài trả 404.
map $host $from_outside {
    default 1;
    localhost 0;
    127.0.0.1 0;
}

map $uri $staff_only {
    default 0;
    ~^/admin(/|$) 1;
    ~^/api/v1/(admin|branch|employees)(/|$) 1;
}

server {
    listen 80;
    server_name localhost;

    set $staff_from_outside "$from_outside$staff_only";
    if ($staff_from_outside = "11") {
        return 404;
    }

    root /usr/share/nginx/html;
    index index.html;

    # Bind-mounted files from Windows: do not trust sendfile / cached metadata
    sendfile off;
    open_file_cache off;

    client_max_body_size 12m;

    # Phân giải tên backend lúc có request (không lỗi khi nginx khởi động trước backend)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    # API (kể cả chatbot trả lời chậm ~60 giây và /chat/stream: không đệm, chờ tối đa 5 phút)
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Ảnh khách / admin tải lên
    location /uploads/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }
}
