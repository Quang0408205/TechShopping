# Frontend (dev): serves ./frontend as mounted, never cached, so an edit shows on the next reload.
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Bind-mounted files from Windows: do not trust sendfile / cached metadata
    sendfile off;
    open_file_cache off;

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ =404;
    }
}
