services:
  postgres:
    # PostgreSQL 16 + extension pgvector (Vector Database cho chatbot RAG); dùng chung volume với postgres:16 cũ
    image: pgvector/pgvector:pg16-trixie
    container_name: techshopping-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: techshopping
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init scripts run only when the data volume is empty
      - ./database/techshopping.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/docker-init/02_create_test_db.sh:/docker-entrypoint-initdb.d/02_create_test_db.sh:ro
      # Catalogue TGDĐ đã crawl (4.288 sản phẩm), chỉ nạp vào DB techshopping, không có user
      - ./database/docker-init/03_seed_catalog.sql:/docker-entrypoint-initdb.d/03_seed_catalog.sql:ro
      # Local demo users, orders, and related sample records; only runs on an empty database volume
      - ./database/docker-init/04_seed_local_sample_data.sql:/docker-entrypoint-initdb.d/04_seed_local_sample_data.sql:ro
      # Tên sản phẩm chỉ còn tên máy (dung lượng / màu / sạc vào phiên bản); chạy trước 05 để 05 gộp các tên trùng
      - ./database/migrations/product_base_names.sql:/docker-entrypoint-initdb.d/04b_product_base_names.sql:ro
      # Khách mẫu của 04 thành họ tên / số điện thoại / địa chỉ như người thật (bỏ dấu "TÀI KHOẢN MẪU"); chạy trước 07
      - ./database/docker-init/04c_sample_customer_names.sql:/docker-entrypoint-initdb.d/04c_sample_customer_names.sql:ro
      # Gộp sản phẩm chỉ khác RAM / bộ nhớ thành một sản phẩm nhiều phiên bản, bỏ phiên bản giá 0
      - ./database/migrations/merge_product_variants.sql:/docker-entrypoint-initdb.d/05_merge_product_variants.sql:ro
      # Chi nhánh mẫu: cửa hàng mẫu của 04 thành POY Quận 1, thêm 5 chi nhánh TP.HCM / Hà Nội / Đà Nẵng (demo)
      - ./database/docker-init/05b_sample_stores.sql:/docker-entrypoint-initdb.d/05b_sample_stores.sql:ro
      # Nhân viên mẫu: mỗi chi nhánh 1 quản lý + 2 nhân viên (mật khẩu SampleOnly123!, demo)
      - ./database/docker-init/05c_sample_staff.sql:/docker-entrypoint-initdb.d/05c_sample_staff.sql:ro
      # Tồn kho mẫu: mọi phiên bản đang bán có 5–40 cái ở mỗi chi nhánh đang mở (demo)
      - ./database/docker-init/06_sample_stock.sql:/docker-entrypoint-initdb.d/06_sample_stock.sql:ro
      # Khuyến mãi, voucher và combo mẫu (demo)
      - ./database/docker-init/07_sample_promotions.sql:/docker-entrypoint-initdb.d/07_sample_promotions.sql:ro
      # Doanh thu mẫu: 2.400 khách mẫu + ~3.000 đơn 05–10/2026 ở 6 chi nhánh (giao, huỷ, trả hàng, hoa hồng, điểm thưởng; demo)
      - ./database/docker-init/07_sample_sales.sql:/docker-entrypoint-initdb.d/07_sample_sales.sql:ro
      # Bộ lọc thông số + nhu cầu của catalogue (xuất từ reindex-filters / import_needs.py, khớp theo SKU)
      - ./database/docker-init/08_catalog_filters_needs.sql:/docker-entrypoint-initdb.d/08_catalog_filters_needs.sql:ro
      # Hoạt động mẫu: bảo hành, voucher trên đơn, đánh giá + lượt thích, yêu thích, liên hệ, yêu cầu hậu mãi (demo)
      - ./database/docker-init/09_sample_activity.sql:/docker-entrypoint-initdb.d/09_sample_activity.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d techshopping"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: techshopping-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Spring Boot API on the dev profile: http://localhost:8080 (Swagger: /swagger-ui/index.html).
  # After changing backend code: docker compose up -d --build backend
  backend:
    build: ./backend/Tech
    container_name: techshopping-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/techshopping
      SPRING_DATA_REDIS_HOST: redis
      # Values come from .env (git-ignored); copy .env.example to .env first
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is missing - copy .env.example to .env and set it}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Shop bank account for the transfer QR + the bank webhook (see .env.example); empty = demo account / webhook off
      PAYMENT_BANK_NAME: ${PAYMENT_BANK_NAME:-}
      PAYMENT_BANK_BIN: ${PAYMENT_BANK_BIN:-}
      PAYMENT_BANK_ACCOUNT_NUMBER: ${PAYMENT_BANK_ACCOUNT_NUMBER:-}
      PAYMENT_BANK_ACCOUNT_NAME: ${PAYMENT_BANK_ACCOUNT_NAME:-}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      PAYMENT_SIMULATOR_ENABLED: ${PAYMENT_SIMULATOR_ENABLED:-false}
      # Thẻ quốc tế qua Stripe Checkout, chỉ dùng khoá Test (sk_test_…); trống = ẩn hình thức này
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Email đơn hàng: Gmail SMTP + App Password; MAIL_USERNAME trống = không gửi (ghi SKIPPED trong email_log)
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-POY}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      # Địa chỉ web trong các link của email (…/customer/track.html?token=…); mặc định lấy địa chỉ công khai, không thì localhost
      MAIL_SITE_URL: ${MAIL_SITE_URL:-${APP_PUBLIC_BASE_URL:-http://localhost:5510}}
      # Ảnh đại diện lên Cloudinary; thiếu một trong 3 khoá = lưu ổ đĩa như ảnh khác
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      # Địa chỉ web công khai (vd. https://ten-cua-ban.ngrok-free.app): được ghi vào link ảnh tải lên
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:8080}
      # Cho trình duyệt gọi API từ địa chỉ công khai (POST kèm Origin: https://<tên-miền>), không thì 403 Invalid CORS request
      CORS_ALLOWED_ORIGINS: ${APP_PUBLIC_BASE_URL:-http://localhost:8080}
      AI_SERVICE_URL: http://ai-service:8000
      AI_INTERNAL_KEY: ${AI_INTERNAL_KEY:-dev-internal-key}
    ports:
      - "8080:8080"
    volumes:
      # Ảnh sản phẩm upload từ trang admin; giữ lại khi build / tạo lại container
      - uploads_data:/app/uploads

  # AI Service (Python/FastAPI): khuyến nghị sản phẩm + chatbot. Chỉ backend gọi vào (header X-Internal-Key).
  # Lần đầu build lâu (tải PyTorch CPU + mô hình embedding). Sau khi sửa code: docker compose up -d --build ai-service
  ai-service:
    build: ./AI_Service
    container_name: techshopping-ai
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AI_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/techshopping
      AI_BACKEND_URL: http://backend:8080/api/v1
      AI_INTERNAL_KEY: ${AI_INTERNAL_KEY:-dev-internal-key}
      # LLM của chatbot: mặc định Ollama chạy trên máy host (miễn phí); xem AI_Service/README.md mục 8.2
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      AI_CHAT_EFFORT: ${AI_CHAT_EFFORT:-low}
    extra_hosts:
      # Linux cần dòng này để host.docker.internal trỏ về máy host (Mac / Windows có sẵn)
      - "host.docker.internal:host-gateway"
    ports:
      # mở ra máy host chỉ để thử /docs khi phát triển
      - "127.0.0.1:8000:8000"
    volumes:
      - ai_models:/app/models
      # bộ câu hỏi + kết quả đánh giá chatbot (scripts/eval_chatbot.py) ghi thẳng vào repo
      - ./AI_Service/evals:/app/evals

  # Static frontend: http://localhost:5510 (5500 = Oracle, 5501 = Live Server, 5502 = Antigravity).
  # ./frontend is mounted, so edits show on reload without rebuilding.
  frontend:
    image: nginx:alpine
    container_name: techshopping-frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${FRONTEND_PORT:-5510}:80"

volumes:
  postgres_data:
  uploads_data:
  ai_models:
