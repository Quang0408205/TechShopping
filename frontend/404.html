<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Không tìm thấy trang - POY</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/customer-theme.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >
    <style>
        .not-found {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 40px 20px;
            text-align: center;
        }

        .not-found-code {
            font-size: clamp(72px, 16vw, 140px);
            font-weight: 800;
            line-height: 1;
            letter-spacing: 6px;
            color: var(--color-accent, #a67c3d);
        }

        .not-found h1 {
            font-size: 24px;
            margin: 0;
        }

        .not-found p {
            max-width: 420px;
            margin: 0;
            color: var(--text-muted, #777);
        }

        .not-found-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 8px;
        }
    </style>
</head>

<body>

<main class="not-found">

    <a href="/index.html" class="logo">
        <span class="logo-main">POY</span>
        <span class="logo-sub">ĐỈNH CAO CÔNG NGHỆ</span>
    </a>

    <div class="not-found-code" aria-hidden="true">404</div>

    <h1>Không tìm thấy trang bạn cần</h1>

    <p>Đường dẫn có thể đã thay đổi hoặc sản phẩm không còn được bán. Bạn có thể quay lại trang chủ hoặc xem danh sách sản phẩm.</p>

    <div class="not-found-actions">
        <a href="/index.html" class="btn btn-dark">Về trang chủ</a>
        <a href="/customer/products.html" class="btn btn-outline-dark">Xem sản phẩm</a>
    </div>

</main>

</body>
</html>
