<!--
    HEADER DÙNG CHUNG
    Được js/core/layout.js chèn vào chỗ <div data-include="header" data-active="..."></div>.
    layout.js chỉ lấy phần tử gốc đầu tiên: mọi thứ phải nằm trong <header class="header">.
    {{ROOT}} được thay bằng đường dẫn gốc của website.
    data-page của menu khớp với data-active của trang để tô đậm mục đang xem.
    Menu mobile, mega-menu, gợi ý tìm kiếm: js/customer/ui-effects.js (chỉ giao diện).
-->
<header class="header">

    <div class="header-announce">

        <div class="container header-announce-inner">

            <p>
                <span>Trả góp 0% cho đơn từ 3.000.000đ</span>
                <span>Trả hàng hoàn tiền trong 7 ngày</span>
                <span>Nhận hàng tại cửa hàng</span>
            </p>

            <a href="{{ROOT}}customer/services.html">Chính sách mua hàng</a>

        </div>

    </div>


    <div class="container header-inner">

        <button type="button" class="header-icon-btn menu-toggle" aria-label="Mở menu" aria-expanded="false" aria-controls="siteNav">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>

        <a href="{{ROOT}}index.html" class="logo" aria-label="POY - Trang chủ">
            <span class="logo-main">POY</span>
            <span class="logo-sub">ĐỈNH CAO CÔNG NGHỆ</span>
        </a>

        <nav class="nav" id="siteNav" aria-label="Điều hướng chính">
            <button type="button" class="nav-close" aria-label="Đóng menu">
                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
            <a href="{{ROOT}}index.html" data-page="home">Trang chủ</a>
            <a href="{{ROOT}}customer/products.html" data-page="products" class="nav-has-mega">Sản phẩm</a>
            <button type="button" class="mega-toggle" aria-label="Danh mục sản phẩm" aria-expanded="false" aria-controls="megaMenu">
                <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <a href="{{ROOT}}customer/services.html" data-page="services">Dịch vụ</a>
            <a href="{{ROOT}}customer/contact.html" data-page="contact">Liên hệ</a>
        </nav>

        <!-- Tìm kiếm sản phẩm: submit → customer/products.html?search=... (main.js) -->
        <form class="search-form" role="search">

            <input
                type="search"
                placeholder="Tìm iPhone, MacBook, tai nghe..."
                aria-label="Tìm sản phẩm"
                maxlength="100"
                autocomplete="off"
            >

            <button type="submit" aria-label="Tìm kiếm">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>

            <!-- Gợi ý tĩnh (không gọi API): bấm → điền ô tìm kiếm rồi submit như bình thường -->
            <div class="search-suggest" hidden>
                <span class="search-suggest-label">Tìm nhiều</span>
                <button type="button" data-suggest="iPhone 17">iPhone 17</button>
                <button type="button" data-suggest="MacBook Air">MacBook Air</button>
                <button type="button" data-suggest="Galaxy S25">Galaxy S25</button>
                <button type="button" data-suggest="iPad">iPad</button>
                <button type="button" data-suggest="AirPods">AirPods</button>
                <button type="button" data-suggest="Tai nghe Sony">Tai nghe Sony</button>
                <button type="button" data-suggest="Chuột Logitech">Chuột Logitech</button>
            </div>

        </form>

        <!-- Header actions -->
        <div class="header-actions">

            <a href="{{ROOT}}customer/cart.html" class="cart-btn" aria-label="Giỏ hàng">
                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 4h2.2l2.1 10.2a1.5 1.5 0 0 0 1.5 1.2h8.4a1.5 1.5 0 0 0 1.5-1.1L20.5 8H6.1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9.5" cy="19.5" r="1.4" fill="currentColor"/><circle cx="17" cy="19.5" r="1.4" fill="currentColor"/></svg>
                <span class="cart-count">0</span>
            </a>

            <a href="{{ROOT}}auth/login.html" class="login-btn">
                Đăng nhập
            </a>

        </div>


        <div class="mega-menu" id="megaMenu" hidden>

            <div class="mega-menu-grid">

                <a href="{{ROOT}}customer/products.html?category=phone" class="mega-card">
                    <img src="{{ROOT}}assets/images/category-phone.webp" alt="" width="503" height="600" loading="lazy">
                    <span>Điện thoại</span>
                </a>

                <a href="{{ROOT}}customer/products.html?category=laptop" class="mega-card">
                    <img src="{{ROOT}}assets/images/category-laptop.webp" alt="" width="600" height="378" loading="lazy">
                    <span>Laptop</span>
                </a>

                <a href="{{ROOT}}customer/products.html?category=tablet" class="mega-card">
                    <img src="{{ROOT}}assets/images/category-tablet.webp" alt="" width="545" height="600" loading="lazy">
                    <span>Máy tính bảng</span>
                </a>

                <a href="{{ROOT}}customer/products.html?category=accessory" class="mega-card">
                    <img src="{{ROOT}}assets/images/category-accessory.webp" alt="" width="329" height="474" loading="lazy">
                    <span>Phụ kiện</span>
                </a>

                <div class="mega-links">
                    <span class="mega-links-title">Mua sắm</span>
                    <a href="{{ROOT}}customer/products.html">Tất cả sản phẩm</a>
                    <a href="{{ROOT}}customer/recommendation.html">Gợi ý cho bạn</a>
                    <a href="{{ROOT}}customer/services.html#chinh-sach-bao-hanh">Bảo hành</a>
                    <a href="{{ROOT}}customer/services.html#chinh-sach-doi-tra">Trả hàng</a>
                </div>

            </div>

        </div>

    </div>

</header>
