<!--
    TOPBAR KHU QUẢN TRỊ NỘI BỘ (admin/)
    Được js/core/layout.js chèn vào <div data-include="admin-topbar"></div>.
    js/admin/admin-layout.js điền tiêu đề trang, ảnh đại diện (chữ cái đầu), tên, vai trò · chi nhánh và gắn nút đăng xuất.
-->
<header class="admin-topbar">

    <button
        type="button"
        class="admin-sidebar-toggle"
        id="adminSidebarToggle"
        aria-label="Mở / đóng menu"
        aria-controls="adminSidebar"
        aria-expanded="false"
    >
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>

    <h1 class="admin-page-title" id="adminPageTitle"></h1>

    <div class="admin-topbar-user">

        <div class="admin-bell" id="adminBell">

            <button type="button" class="admin-bell-btn" id="adminBellBtn" aria-label="Thông báo" aria-haspopup="true" aria-expanded="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17V11a6 6 0 1112 0v6l1.5 2h-15zM10 21h4"/></svg>
                <span class="admin-bell-count" id="adminBellCount" hidden>0</span>
            </button>

            <div class="admin-bell-panel" id="adminBellPanel" hidden>

                <div class="admin-bell-head">
                    <strong>Thông báo</strong>
                    <button type="button" class="admin-link-btn" id="adminBellReadAll">Đánh dấu đã đọc tất cả</button>
                </div>

                <ul class="admin-bell-list" id="adminBellList"></ul>

                <a class="admin-bell-foot" id="adminBellAll" href="{{ROOT}}admin/notifications.html">Xem tất cả thông báo</a>

            </div>

        </div>

        <span class="admin-avatar" id="adminUserAvatar" aria-hidden="true"></span>

        <div class="admin-user-info">
            <strong id="adminUserName">—</strong>
            <span id="adminUserMeta">—</span>
        </div>

        <button type="button" class="btn btn-outline-dark admin-logout-btn" id="adminLogoutBtn">
            Đăng xuất
        </button>

    </div>

</header>
