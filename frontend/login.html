<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Đăng nhập - LAHY</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

</head>

<body class="login-page">


<div class="login-wrapper">


    <div class="login-box">


        <a
            href="index.html"
            class="logo login-logo"
        >

            <span class="logo-main">
                LAHY
            </span>

            <span class="logo-sub">
                ĐỈNH CAO CÔNG NGHỆ
            </span>

        </a>


        <span class="section-label">
            TÀI KHOẢN
        </span>


        <h1>
            ĐĂNG NHẬP
        </h1>


        <form id="loginForm">


            <label>
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Nhập email"
                required
            >


            <label>
                Mật khẩu
            </label>

            <input
                type="password"
                id="password"
                placeholder="Nhập mật khẩu"
                required
            >


            <button
                type="submit"
                class="btn btn-dark"
            >
                ĐĂNG NHẬP
            </button>


        </form>


        <div class="login-links">

            <a href="#">
                Quên mật khẩu?
            </a>

            <span>
                Chưa có tài khoản?
            </span>

            <a href="#">
                Đăng ký
            </a>

        </div>


        <a
            href="index.html"
            class="back-home"
        >
            ← Quay lại trang chủ
        </a>


    </div>


</div>


<script src="js/login.js"></script>

</body>
</html>
