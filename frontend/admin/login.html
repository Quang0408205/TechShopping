<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Đăng nhập nội bộ - POY</title>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="stylesheet" href="../css/auth/login.css">

    <link rel="stylesheet" href="../css/admin/admin.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

</head>

<body class="login-page admin-login-page">


<div class="login-wrapper">

    <div class="login-box">

        <a href="../index.html" class="logo login-logo">
            <span class="logo-main">POY</span>
            <span class="logo-sub">QUẢN TRỊ NỘI BỘ</span>
        </a>


        <span class="section-label">
            NHÂN VIÊN
        </span>

        <h1>
            ĐĂNG NHẬP
        </h1>

        <p class="login-intro">
            Dành cho nhân viên, quản lý chi nhánh và quản trị viên.
        </p>


        <form id="staffLoginForm" novalidate>

            <p
                id="staffLoginError"
                class="form-error"
                role="alert"
                hidden
            ></p>


            <label for="staffEmail">
                Email hoặc tên đăng nhập
            </label>

            <input
                type="text"
                id="staffEmail"
                placeholder="Nhập email hoặc tên đăng nhập"
                autocomplete="username"
                required
            >


            <label for="staffPassword">
                Mật khẩu
            </label>

            <input
                type="password"
                id="staffPassword"
                placeholder="Nhập mật khẩu"
                autocomplete="current-password"
                required
            >


            <button
                type="submit"
                id="staffLoginButton"
                class="btn btn-dark"
            >
                ĐĂNG NHẬP
            </button>

        </form>


        <!-- B2: đăng nhập bằng tài khoản thật (POST /api/v1/auth/login) -->
        <div class="admin-demo-accounts">
            <strong>TÀI KHOẢN NỘI BỘ</strong>
            Dùng tài khoản có quyền Nhân viên (STAFF) hoặc Quản trị viên (ADMIN).
            Tài khoản ADMIN đầu tiên được tạo từ file .env (xem readme.md).
        </div>


        <a href="../index.html" class="back-home">
            ← Quay lại trang khách hàng
        </a>

    </div>

</div>


<script src="../js/core/api.js"></script>
<script src="../js/core/ui.js"></script>
<script src="../js/admin/mock-staff-data.js"></script>
<script src="../js/admin/staff-auth.js"></script>
<script src="../js/admin/login.js"></script>

</body>
</html>
