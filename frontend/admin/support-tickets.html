<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hỗ trợ khách hàng - Quản trị POY</title>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="stylesheet" href="../css/admin/admin.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

</head>

<!-- data-roles: vai trò được vào trang (bỏ trống = mọi nhân viên), kiểm tra ở js/admin/admin-layout.js -->
<body class="admin-body" data-page-title="Hỗ trợ khách hàng" data-roles="">


<div class="admin-shell">

    <div data-include="admin-sidebar" data-active="support-tickets"></div>


    <div class="admin-main">

        <div data-include="admin-topbar"></div>


        <main class="admin-content">

            <p class="admin-mock-note">
                Dữ liệu mẫu: màn hình này chưa nối backend (các module Đơn hàng, Bảo hành,
                Chi nhánh / Nhân viên, Chatbot được xây ở Phase 4–9). Thay đổi chỉ lưu trên trình duyệt này.
            </p>

            <div class="admin-filter-bar">

                <select id="statusFilter" aria-label="Trạng thái">
                    <option value="">Tất cả trạng thái</option>
                    <option value="OPEN">Mới</option>
                    <option value="IN_PROGRESS">Đang xử lý</option>
                    <option value="RESOLVED">Đã giải quyết</option>
                </select>

                <!-- js/admin/support-tickets.js dựng theo vai trò -->
                <select id="storeFilter" aria-label="Chi nhánh"></select>

            </div>


            <section class="admin-panel">

                <div class="admin-panel-header">
                    <h2>Danh sách ticket</h2>
                    <span class="admin-row-count" id="ticketRowCount"></span>
                </div>

                <div class="admin-table-wrapper">
                    <table class="admin-table admin-table--wide">
                        <thead>
                            <tr>
                                <th>Mã</th>
                                <th>Chủ đề</th>
                                <th>Khách hàng</th>
                                <th>Chi nhánh</th>
                                <th>NV phụ trách</th>
                                <th>Ưu tiên</th>
                                <th>Ngày tạo</th>
                                <th>Trạng thái</th>
                            </tr>
                        </thead>
                        <tbody id="ticketTableBody"></tbody>
                    </table>
                </div>

            </section>

        </main>

    </div>

</div>


<script src="../js/core/api.js"></script>
<script src="../js/core/ui.js"></script>
<script src="../js/core/layout.js"></script>
<script src="../js/admin/mock-staff-data.js"></script>
<script src="../js/admin/staff-auth.js"></script>
<script src="../js/admin/admin-layout.js"></script>
<script src="../js/admin/support-tickets.js"></script>

</body>
</html>
