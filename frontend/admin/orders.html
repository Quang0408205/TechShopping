<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Đơn hàng - Quản trị POY</title>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="stylesheet" href="../css/admin/admin.css">
    <link rel="stylesheet" href="../css/admin/admin-shell.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

</head>

<!-- data-roles: vai trò được vào trang (bỏ trống = mọi nhân viên), kiểm tra ở js/admin/admin-layout.js -->
<body class="admin-body" data-page-title="Đơn hàng" data-roles="">


<div class="admin-shell">

    <div data-include="admin-sidebar" data-active="orders"></div>


    <div class="admin-main">

        <div data-include="admin-topbar"></div>


        <main class="admin-content">


            <!-- Tab trạng thái: js/admin/orders.js đồng bộ với #orderStatusFilter (ẩn) và điền số đơn -->
            <div class="admin-tabs admin-order-tabs" id="orderStatusTabs" role="tablist" aria-label="Trạng thái đơn">
                <button type="button" role="tab" class="admin-tab" data-status="">Tất cả <span class="admin-tab-count"></span></button>
                <button type="button" role="tab" class="admin-tab" data-status="PENDING">Chờ xác nhận <span class="admin-tab-count"></span></button>
                <button type="button" role="tab" class="admin-tab" data-status="CONFIRMED">Đã xác nhận <span class="admin-tab-count"></span></button>
                <button type="button" role="tab" class="admin-tab" data-status="SHIPPING">Đang giao <span class="admin-tab-count"></span></button>
                <button type="button" role="tab" class="admin-tab" data-status="DELIVERED">Đã giao <span class="admin-tab-count"></span></button>
                <button type="button" role="tab" class="admin-tab" data-status="CANCELLED">Đã hủy <span class="admin-tab-count"></span></button>
            </div>

            <form class="admin-filter-bar" id="orderFilterForm" role="search">

                <input type="search" id="orderKeyword" placeholder="Mã đơn, người nhận, SĐT, email khách…" maxlength="255" aria-label="Từ khoá">

                <select id="orderStatusFilter" aria-label="Trạng thái" hidden>
                    <option value="">Tất cả trạng thái</option>
                    <option value="PENDING">Chờ xác nhận</option>
                    <option value="CONFIRMED">Đã xác nhận</option>
                    <option value="SHIPPING">Đang giao hàng</option>
                    <option value="DELIVERED">Đã giao hàng</option>
                    <option value="CANCELLED">Đã hủy</option>
                </select>

                <div class="admin-quick-dates" id="orderQuickDates" role="group" aria-label="Khoảng ngày đặt">
                    <button type="button" data-range="today">Hôm nay</button>
                    <button type="button" data-range="yesterday">Hôm qua</button>
                    <button type="button" data-range="7d">7 ngày</button>
                    <button type="button" data-range="month">Tháng này</button>
                    <button type="button" data-range="all">Mọi ngày</button>
                </div>

                <label class="admin-date-filter">
                    Từ
                    <input type="date" id="orderFromDate" aria-label="Đặt từ ngày">
                </label>

                <label class="admin-date-filter">
                    đến
                    <input type="date" id="orderToDate" aria-label="Đặt đến ngày">
                </label>

                <!-- ADMIN: mọi chi nhánh; nhân viên: khoá vào chi nhánh của mình -->
                <select id="orderStoreFilter" aria-label="Chi nhánh"></select>

                <button type="submit" class="btn btn-dark">TÌM</button>

            </form>

            <p id="orderFilterError" class="form-error" role="alert" hidden></p>


            <section class="admin-panel">

                <div class="admin-panel-header">
                    <h2>Danh sách đơn hàng</h2>
                    <span class="admin-row-count" id="orderRowCount"></span>
                </div>

                <div class="admin-table-wrapper">
                    <table class="admin-table admin-table--wide">
                        <thead>
                            <tr>
                                <th></th>
                                <th>Mã đơn / ngày đặt</th>
                                <th>Khách hàng</th>
                                <th>Người nhận</th>
                                <th>SL</th>
                                <th>Tổng tiền</th>
                                <th>Thanh toán</th>
                                <th>Trạng thái / xử lý</th>
                            </tr>
                        </thead>
                        <tbody id="orderTableBody"></tbody>
                    </table>
                </div>

                <div class="admin-pagination" id="orderPagination"></div>

            </section>

        </main>

    </div>

</div>


<script src="../js/core/api.js"></script>
<script src="../js/core/ui.js"></script>
<script src="../js/core/layout.js"></script>
<script src="../js/admin/staff-auth.js"></script>
<script src="../js/admin/admin-layout.js"></script>
<script src="../js/admin/admin-payments.js"></script>
<script src="../js/admin/orders.js"></script>

</body>
</html>
