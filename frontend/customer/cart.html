<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Giỏ hàng - POY</title>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="stylesheet" href="../css/customer-theme.css">
    <link rel="stylesheet" href="../css/customer/cart.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

</head>

<body>


<div data-include="header" data-active="cart"></div>


<main>

    <section class="page-hero">

        <div class="container page-hero-row">

            <div>

                <nav class="breadcrumb" aria-label="Đường dẫn">
                    <a href="../index.html">Trang chủ</a>
                    <span aria-hidden="true">/</span>
                    <span aria-current="page">Giỏ hàng</span>
                </nav>

                <h1>Giỏ hàng</h1>

            </div>

            <ol class="checkout-steps" aria-label="Các bước mua hàng">
                <li class="is-current" aria-current="step"><span>1</span>Giỏ hàng</li>
                <li><span>2</span>Thanh toán</li>
                <li><span>3</span>Hoàn tất</li>
            </ol>

        </div>

    </section>


    <section class="section">

        <div class="container">

            <div
                id="cartContainer"
                class="cart-container"
            >

            </div>

        </div>

    </section>

</main>


<div data-include="footer"></div>


<script src="../js/core/api.js"></script>
<script src="../js/core/ui.js"></script>
<script src="../js/core/cart-store.js"></script>
<script src="../js/core/layout.js"></script>
<script src="../js/core/main.js"></script>
<script src="../js/customer/cart.js"></script>
<script src="../js/customer/chatbot.js"></script>
<script src="../js/customer/ui-effects.js"></script>

</body>
</html>
