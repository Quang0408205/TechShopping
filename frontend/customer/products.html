<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sản phẩm - POY</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link rel="stylesheet" href="../css/customer-theme.css">

    <link
        rel="stylesheet"
        href="../css/customer/products.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

</head>

<body>


<div data-include="header" data-active="products"></div>


<main>

    <section class="page-hero">

        <div class="container">

            <nav class="breadcrumb" aria-label="Đường dẫn">
                <a href="../index.html">Trang chủ</a>
                <span aria-hidden="true">/</span>
                <span aria-current="page">Sản phẩm</span>
            </nav>

            <h1>Sản phẩm</h1>

            <p>
                Điện thoại, laptop, máy tính bảng và phụ kiện chính hãng.
                Lọc theo danh mục, thương hiệu và khoảng giá.
            </p>

        </div>

    </section>


    <section class="section products-page">

        <div class="container products-layout">

            <button
                type="button"
                id="toggleFiltersBtn"
                class="btn btn-outline-dark filters-toggle"
                aria-controls="productsSidebar"
                aria-expanded="false"
            >
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                Bộ lọc
            </button>


            <!-- Sidebar bộ lọc: cố định khi cuộn (position: sticky, xem products.css) -->
            <aside class="products-sidebar" id="productsSidebar">

                <div class="filter-group">

                    <h4>Danh mục</h4>

                    <!-- value = data-category cũ; products.js map sang slug trong DB -->
                    <label>
                        <input type="radio" name="category" value="" checked>
                        Tất cả
                    </label>

                    <label>
                        <input type="radio" name="category" value="laptop">
                        Laptop
                    </label>

                    <label>
                        <input type="radio" name="category" value="phone">
                        Điện thoại
                    </label>

                    <label>
                        <input type="radio" name="category" value="tablet">
                        Tablet
                    </label>

                    <label>
                        <input type="radio" name="category" value="accessory">
                        Phụ kiện
                    </label>

                </div>


                <div class="filter-group">

                    <h4 id="brandFilterTitle">Thương hiệu</h4>

                    <!-- products.js dựng theo danh mục đang chọn -->
                    <div id="brandOptionsList" class="brand-options"></div>

                </div>


                <div class="filter-group">

                    <h4>Khoảng giá (đ)</h4>

                    <div class="price-range-inputs">

                        <input
                            type="number"
                            id="minPriceInput"
                            placeholder="Từ"
                            min="0"
                            step="500000"
                            aria-label="Giá từ"
                        >

                        <span>-</span>

                        <input
                            type="number"
                            id="maxPriceInput"
                            placeholder="Đến"
                            min="0"
                            step="500000"
                            aria-label="Giá đến"
                        >

                    </div>

                    <small class="field-error" id="priceError"></small>

                </div>


                <button
                    type="button"
                    id="clearFiltersBtn"
                    class="btn btn-outline-dark filters-clear"
                >
                    Xoá bộ lọc
                </button>

            </aside>


            <div class="products-main">

                <div class="products-toolbar">

                    <p id="resultCount" class="result-count" aria-live="polite"></p>

                    <!-- Lưới / danh sách: chỉ đổi giao diện (js/customer/ui-effects.js) -->
                    <div class="view-toggle" role="group" aria-label="Kiểu hiển thị">
                        <button type="button" data-view="grid" aria-pressed="true" aria-label="Dạng lưới">
                            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
                        </button>
                        <button type="button" data-view="list" aria-pressed="false" aria-label="Dạng danh sách">
                            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 5h5v5H4zM4 14h5v5H4zM12 7h8M12 16h8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </button>
                    </div>

                    <select id="sortSelect" aria-label="Sắp xếp">
                        <option value="id,asc">Mặc định</option>
                        <option value="id,desc">Mới nhất</option>
                        <option value="basePrice,asc">Giá: Thấp đến cao</option>
                        <option value="basePrice,desc">Giá: Cao đến thấp</option>
                        <option value="name,asc">Tên: A - Z</option>
                    </select>

                </div>


                <!-- Bộ lọc đang áp dụng: đọc từ các ô lọc gốc, bấm × thì đổi ô lọc đó (js/customer/ui-effects.js) -->
                <div class="active-filters" id="activeFilters" hidden></div>


                <!-- products.js render từ GET /api/v1/products -->
                <div class="product-grid" id="productGrid"></div>


                <nav class="pagination" id="pagination" aria-label="Phân trang"></nav>

            </div>

        </div>

    </section>

</main>


<div data-include="footer"></div>


<script src="../js/core/api.js"></script>
<script src="../js/core/ui.js"></script>
<script src="../js/core/cart-store.js"></script>
<script src="../js/core/layout.js"></script>
<script src="../js/core/main.js"></script>
<script src="../js/customer/products.js"></script>

<script src="../js/customer/chatbot.js"></script>
<script src="../js/customer/ui-effects.js"></script>

</body>
</html>
