<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Liên hệ - POY</title>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="stylesheet" href="../css/customer-theme.css">
    <link rel="stylesheet" href="../css/customer/contact.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

</head>

<body>


<div data-include="header" data-active="contact"></div>


<main>

    <section class="page-hero">

        <div class="container">

            <span class="section-label">
                POY
            </span>

            <h1>
                LIÊN HỆ
            </h1>

            <p>
                Hãy liên hệ với chúng tôi nếu bạn cần
                hỗ trợ hoặc tư vấn.
            </p>

        </div>

    </section>


    <section class="section">

        <div class="container contact-grid">


            <div class="contact-info">

                <span class="section-label">
                    THÔNG TIN
                </span>

                <h2>
                    CHÚNG TÔI LUÔN SẴN SÀNG
                    HỖ TRỢ BẠN
                </h2>

                <div class="contact-item">

                    <strong>
                        HOTLINE
                    </strong>

                    <p>
                        1900 0000
                    </p>

                </div>


                <div class="contact-item">

                    <strong>
                        EMAIL
                    </strong>

                    <p>
                        support@poy.vn
                    </p>

                </div>


                <div class="contact-item">

                    <strong>
                        THỜI GIAN HỖ TRỢ
                    </strong>

                    <p>
                        08:00 - 22:00
                    </p>

                </div>

            </div>


            <form
                id="contactForm"
                class="contact-form"
                novalidate
            >

                <p
                    id="contactSuccess"
                    class="form-success"
                    role="status"
                    hidden
                ></p>

                <p
                    id="contactError"
                    class="form-error"
                    role="alert"
                    hidden
                ></p>

                <label>
                    Họ và tên
                </label>

                <input
                    type="text"
                    id="contactName"
                    required
                >


                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="contactEmail"
                    required
                >


                <label>
                    Nội dung
                </label>

                <textarea
                    id="contactMessage"
                    rows="7"
                    required
                ></textarea>


                <button
                    type="submit"
                    class="btn btn-dark"
                >
                    GỬI LIÊN HỆ
                </button>

            </form>

        </div>

    </section>

</main>


<div data-include="footer"></div>


<script src="../js/core/api.js"></script>
<script src="../js/core/ui.js"></script>
<script src="../js/core/cart-store.js"></script>
<script src="../js/core/layout.js"></script>
<script src="../js/core/main.js"></script>
<script src="../js/customer/contact.js"></script>
<script src="../js/customer/chatbot.js"></script>
<script src="../js/customer/ui-effects.js"></script>

</body>
</html>
