<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Khuyến nghị AI - LAHY</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/customer/recommendation.css">   
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

</head>

<body>


<div data-include="header" data-active="recommendation"></div>


<main>

    <section class="page-hero">

        <div class="container">

            <span class="section-label">
                LAHY AI
            </span>

            <h1>
                KHUYẾN NGHỊ
            </h1>

            <p>
                Hệ thống phân tích nhu cầu và đề xuất
                những sản phẩm phù hợp với bạn.
            </p>

        </div>

    </section>


    <section class="section">

        <div class="container">

            <div class="recommendation-box">

                <span class="section-label">
                    AI SHOPPING ASSISTANT
                </span>

                <h2>
                    BẠN ĐANG TÌM KIẾM SẢN PHẨM GÌ?
                </h2>

                <p>
                    Hãy mô tả nhu cầu của bạn.
                    Ví dụ: "Tôi cần laptop để chơi game
                    và lập trình".
                </p>


                <textarea
                    id="recommendationInput"
                    placeholder="Nhập nhu cầu của bạn..."
                ></textarea>


                <button
                    id="recommendationButton"
                    class="btn btn-dark"
                >
                    PHÂN TÍCH NHU CẦU
                </button>

            </div>


            <div
                id="recommendationResult"
                class="recommendation-result"
            >

                <h2>
                    GỢI Ý DÀNH CHO BẠN
                </h2>

                <div
                    id="recommendationProducts"
                    class="product-grid"
                >

                </div>

            </div>

        </div>

    </section>

</main>


<div data-include="footer"></div>


<script src="../js/core/api.js"></script>
<script src="../js/core/layout.js"></script>
<script src="../js/core/main.js"></script>
<script src="../js/customer/recommendation.js"></script>

</body>
</html>
