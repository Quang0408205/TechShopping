<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Lịch sử mua hàng - POY</title>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="stylesheet" href="../css/customer-theme.css">
    <link rel="stylesheet" href="../css/customer/account.css">
    <link rel="stylesheet" href="../css/customer/orders.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

</head>

<body data-account-page="orders">


<div data-include="header" data-active="account"></div>


<main>

    <section class="page-hero account-hero-bar">

        <div class="container">

            <nav class="breadcrumb" aria-label="Đường dẫn">
                <a href="../index.html">Trang chủ</a>
                <span aria-hidden="true">/</span>
                <a href="account.html">Tài khoản</a>
                <span aria-hidden="true">/</span>
                <span aria-current="page">Lịch sử mua hàng</span>
            </nav>

            <h1>Lịch sử mua hàng</h1>

        </div>

    </section>


    <section class="section account-section">

        <div class="container account-layout">

            <div id="accountSidebarRoot"></div>


            <div class="account-main">

                <!-- Kế hoạch v5 GĐ6: tab theo trạng thái (kèm số đơn) + tìm theo mã đơn / tên sản phẩm -->
                <div class="orders-toolbar">

                    <div class="orders-tabs" id="orderTabs" role="tablist" aria-label="Lọc theo trạng thái">
                        <button type="button" role="tab" data-tab="all" class="is-active" aria-selected="true">Tất cả <span data-count="all"></span></button>
                        <button type="button" role="tab" data-tab="pending" aria-selected="false">Chờ xác nhận <span data-count="pending"></span></button>
                        <button type="button" role="tab" data-tab="processing" aria-selected="false">Đang giao <span data-count="inProgress"></span></button>
                        <button type="button" role="tab" data-tab="delivered" aria-selected="false">Đã giao <span data-count="delivered"></span></button>
                        <button type="button" role="tab" data-tab="cancelled" aria-selected="false">Đã huỷ <span data-count="cancelled"></span></button>
                    </div>

                    <form class="orders-search" id="orderSearchForm" role="search">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                        <input type="search" id="orderSearch" maxlength="100" placeholder="Tìm theo mã đơn hoặc tên sản phẩm" aria-label="Tìm đơn hàng">
                    </form>

                </div>

                <div id="ordersList" class="orders-list">
                    <!-- js/customer/orders.js render động -->
                </div>

            </div>

        </div>

    </section>

</main>


<div data-include="footer"></div>


<script src="../js/core/api.js"></script>
<script src="../js/core/ui.js"></script>
<script src="../js/core/cart-store.js"></script>
<script src="../js/core/order-store.js"></script>
<script src="../js/core/layout.js"></script>
<script src="../js/core/main.js"></script>
<script src="../js/customer/account-sidebar.js"></script>
<script src="../js/customer/orders.js"></script>
<script src="../js/customer/chatbot.js"></script>
<script src="../js/customer/ui-effects.js"></script>

</body>
</html>
