<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">

    <title>Đặt lại mật khẩu - POY</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/customer-theme.css">
    <link rel="stylesheet" href="../css/auth/login.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

</head>

<body class="login-page auth-page">

<div class="login-wrapper auth-layout">

    <aside class="auth-aside">

        <a href="../index.html" class="logo auth-aside-logo">
            <span class="logo-main">POY</span>
            <span class="logo-sub">ĐỈNH CAO CÔNG NGHỆ</span>
        </a>

        <div class="auth-aside-text">
            <h2>Đặt mật khẩu mới</h2>
            <p class="auth-intro">Sau khi đổi, mọi thiết bị đang đăng nhập bằng tài khoản này sẽ bị đăng xuất.</p>
        </div>

        <img src="../assets/images/hero-macbook-air.webp" alt="" width="598" height="373" class="auth-aside-image">

    </aside>

    <div class="login-box">

        <a href="../index.html" class="logo login-logo">
            <span class="logo-main">POY</span>
            <span class="logo-sub">ĐỈNH CAO CÔNG NGHỆ</span>
        </a>

        <h1>Đặt lại mật khẩu</h1>

        <form id="resetForm" novalidate>

            <p id="resetError" class="form-error" role="alert" hidden></p>

            <label for="newPassword">Mật khẩu mới</label>

            <div class="password-field">

                <input type="password" id="newPassword" placeholder="Tối thiểu 8 ký tự" autocomplete="new-password" required>

                <button type="button" class="password-toggle" aria-label="Hiện mật khẩu" aria-pressed="false">
                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
                </button>

            </div>

            <label for="confirmPassword">Nhập lại mật khẩu mới</label>

            <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu" autocomplete="new-password" required>

            <button type="submit" id="resetButton" class="btn btn-dark">Đổi mật khẩu</button>

        </form>

        <div id="resetDone" class="form-success" role="status" hidden>
            Đã đổi mật khẩu. <a href="login.html">Đăng nhập</a> bằng mật khẩu mới.
        </div>

        <div class="login-links">
            <a href="forgot-password.html">Gửi lại liên kết</a>
            <a href="login.html">Quay lại đăng nhập</a>
        </div>

    </div>

</div>

<script src="../js/core/api.js"></script>
<script src="../js/auth/reset-password.js"></script>
<script src="../js/customer/compare-wishlist.js"></script>
<script src="../js/customer/ui-effects.js"></script>

</body>
</html>
