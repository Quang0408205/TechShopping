spring:
  application:
    name: techshopping-backend
  profiles:
    active: dev
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      # Database is created from database/techshopping.sql; Hibernate only validates the mapping
      ddl-auto: validate
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  # First ADMIN account, created at startup only while no ADMIN exists.
  # Set through environment variables; never put real values in this file.
  bootstrap-admin:
    email: ${ADMIN_EMAIL:}
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
  jwt:
    # HS256 signing key, at least 32 bytes. Required: set the JWT_SECRET environment variable.
    secret: ${JWT_SECRET:}
    issuer: techshopping
    access-token-ttl: 30m
    refresh-token-ttl: 7d
