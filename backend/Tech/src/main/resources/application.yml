spring:
  application:
    name: techshopping-backend
  profiles:
    active: dev
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      # Database is created from database/techshopping.sql; Hibernate only validates the mapping
      ddl-auto: validate
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  mvc:
    async:
      # Streamed chatbot answers (POST /api/v1/chat/stream) run as async requests; one answer with product search took ~2 minutes on a 4 GB GPU
      request-timeout: 300s
  servlet:
    multipart:
      # Product image uploads (ImageStorageService.MAX_IMAGE_BYTES)
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080
  tomcat:
    # Read (and drop) the rest of a too-large upload so the client gets the 413 JSON instead of a reset connection
    max-swallow-size: 20MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  # First ADMIN account, created at startup only while no ADMIN exists.
  # Set through environment variables; never put real values in this file.
  bootstrap-admin:
    email: ${ADMIN_EMAIL:}
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
  jwt:
    # HS256 signing key, at least 32 bytes. Required: set the JWT_SECRET environment variable.
    secret: ${JWT_SECRET:}
    issuer: techshopping
    access-token-ttl: 30m
    refresh-token-ttl: 7d
  upload:
    # Uploaded product images: folder on disk (relative = working directory; Docker uses the uploads_data volume)
    dir: ${APP_UPLOAD_DIR:uploads}
    # Origin the browser uses to reach this API; stored image URLs start with it
    public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
    # Plan v5 GĐ7: account avatars on Cloudinary (square crop around the face, compressed); any key empty = local disk.
    # Product / review / after-sales photos always stay on the disk
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
      folder: ${CLOUDINARY_FOLDER:techshopping/avatars}
  payment:
    # Shop account shown for bank transfers and used for the VietQR image. Set the real one in .env (never commit it);
    # empty = the demo account
    bank-transfer:
      bank-name: ${PAYMENT_BANK_NAME:Vietcombank}
      # VietQR bank id for the QR image (970436 = Vietcombank)
      bank-bin: ${PAYMENT_BANK_BIN:970436}
      account-number: ${PAYMENT_BANK_ACCOUNT_NUMBER:0123456789}
      account-name: ${PAYMENT_BANK_ACCOUNT_NAME:CONG TY POY}
      # Shown to the customer as "pay before"; unpaid orders are not cancelled automatically
      deadline-hours: 24
    # Bank webhook (POST /api/v1/payments/webhook): the provider sends this key as "Authorization: Apikey <key>" or
    # X-Webhook-Secret. Empty = webhook off. simulator-enabled: lets an ADMIN fake a transfer (demo only)
    webhook:
      secret: ${PAYMENT_WEBHOOK_SECRET:}
      simulator-enabled: ${PAYMENT_SIMULATOR_ENABLED:false}
    # Card payments through Stripe Checkout, TEST keys only (Stripe pays out to no Vietnamese bank). Empty secret key =
    # the "Thẻ quốc tế" method is hidden. Webhook: POST /api/v1/payments/stripe/webhook, signed with the whsec_ key
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      api-base: ${STRIPE_API_BASE:https://api.stripe.com}
      session-minutes: 30
  sales:
    # Commission of the employee who confirmed a delivered order (0.01 = 1% of the order total)
    commission-rate: ${SALES_COMMISSION_RATE:0.01}
  ai:
    # AI_Service (Python/FastAPI, docker service ai-service): recommendations and the chatbot
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    # Shared secret sent as X-Internal-Key; must match AI_INTERNAL_KEY of the AI service
    internal-key: ${AI_INTERNAL_KEY:dev-internal-key}
    # Recommendations fall back to popular / same-category products after this
    timeout: 3s
    # One chatbot answer can take several model + tool calls
    chat-timeout: 240s
  review:
    # An account may write any number of reviews, but two must be at least this many seconds apart (0 = off)
    min-interval-seconds: ${REVIEW_MIN_INTERVAL_SECONDS:60}
  contact:
    # Contact form: at most per-ip sends per client IP and per-email per email address in each window (Redis)
    rate-limit:
      per-ip: ${CONTACT_LIMIT_PER_IP:10}
      per-email: ${CONTACT_LIMIT_PER_EMAIL:3}
      window: 1h
  auth:
    # Wrong passwords on one account within failure-window lock it for lock-duration; per-IP limits on register / refresh (Redis)
    rate-limit:
      max-login-failures: ${LOGIN_MAX_FAILURES:5}
      failure-window: 15m
      lock-duration: 15m
      register-per-ip: ${REGISTER_LIMIT_PER_IP:10}
      register-window: 1h
      refresh-per-ip: ${REFRESH_LIMIT_PER_IP:60}
      refresh-window: 1m
  search:
    # Plan v5: suggestions under the search box (GET /products/suggest), per client IP; generous because behind the
    # deploy proxy every visitor shares the proxy's IP
    suggest-per-ip: ${SUGGEST_LIMIT_PER_IP:600}
    suggest-window: 1m
  cache:
    # Redis read cache (categories, brands, product pages, reports); off = every request reads the database
    enabled: ${CACHE_ENABLED:true}
    catalog-ttl: 1h
    product-ttl: 10m
    report-ttl: 5m
