spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/techshopping_test
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    # Test-only key; never use it outside the test profile
    secret: test-only-jwt-secret-for-techshopping-tests-0123456789
  upload:
    # Keep test uploads out of the project folder
    dir: ${java.io.tmpdir}/techshopping-test-uploads
  review:
    # tests and E2E write several reviews per account in a row (the gap has its own unit test)
    min-interval-seconds: 0
  contact:
    rate-limit:
      # every test / E2E request comes from 127.0.0.1: only the per-email limit is exercised
      per-ip: 1000
  auth:
    rate-limit:
      # every test / E2E request comes from 127.0.0.1: only the per-account lock is exercised
      register-per-ip: 100000
      refresh-per-ip: 100000
  search:
    suggest-per-ip: 100000
  cache:
    # tests share one database and Redis: a cache would show one test the data of another
    enabled: ${CACHE_ENABLED:false}

  payment:
    # Test-only values: the webhook and the transfer simulator work without .env
    webhook:
      secret: test-only-webhook-secret
      simulator-enabled: true
    stripe:
      # Test-only fake keys: backend tests mock Stripe; the E2E tests point api-base to a local fake Stripe
      secret-key: sk_test_only_fake_key
      webhook-secret: whsec_test_only_secret
