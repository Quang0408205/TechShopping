spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/techshopping
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    com.example.Tech: DEBUG

app:
  cors:
    # Frontend served by VS Code Live Server. Port 5500 is taken by Oracle's TNS listener on the
    # main dev machine, so Live Server runs on 5501 there (liveServer.settings.port).
    allowed-origins:
      - http://127.0.0.1:5500
      - http://localhost:5500
      - http://127.0.0.1:5501
      - http://localhost:5501
